name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/video-transcript-downloader/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate skills
        run: scripts/validate-skills

      - name: Check shell helper syntax
        run: |
          find skills -path '*/scripts/*' -type f -print0 |
            while IFS= read -r -d '' script; do
              if head -n 1 "$script" | grep -q 'bash'; then
                bash -n "$script"
              fi
            done

      - name: Test estate maintenance
        run: |
          skills/estate-maintenance/scripts/surface-audit.test.sh
          skills/estate-maintenance/scripts/repo-sync-audit.test.sh

      - name: Test Xcode inventory
        run: skills/xcode-sync/scripts/xcode-host-inventory.test.sh

      - name: Test macOS release helpers
        run: skills/release-mac-app/scripts/lib/mac_release.test.sh

      - name: Test Codex context preflight
        run: python3 skills/codex-huge-context/scripts/preflight.test.py

      - name: Test skill cleaner
        run: node --experimental-strip-types --test skills/skill-cleaner/scripts/skill-cleaner.test.ts

      - name: Test and build browser helper
        run: |
          bun install --frozen-lockfile
          bun test scripts/browser-tools-profile.test.ts
          bun build scripts/browser-tools.ts --compile --target bun --outfile /tmp/browser-tools
          /tmp/browser-tools --help

      - name: Install video transcript downloader dependencies
        working-directory: skills/video-transcript-downloader
        run: npm ci

      - name: Smoke video transcript downloader
        working-directory: skills/video-transcript-downloader
        run: |
          node -e "import('youtube-transcript-plus').then(m => { if (typeof m.YoutubeTranscript?.fetchTranscript !== 'function') process.exit(1); })"
          ./scripts/vtd.js transcript --help

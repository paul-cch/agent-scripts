interface:
  display_name: "Maintainer Orchestrator"
  short_description: "Coordinate repo workers and decision-ready queues"
  default_prompt: "Use $maintainer-orchestrator as the only thread-topology owner for user-assigned maintained repositories. Coordinate one Codex app thread per repository; keep collaboration subagents read-only and support-only; preserve dirty, diverged, or unique local work before synchronization; verify worker permissions before protected actions; and prepare mergeable PRs with live proof and green CI. Before asking the owner, refresh state and provide a concise decision brief with the full URL, change, proof, risks, recommendation, and exact choices; never ask with only land/delete. Release once candidate-specific blockers clear; unrelated open issues and PRs remain backlog and require no exemption."
